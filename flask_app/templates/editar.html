<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Libro</title>
</head>
<body>
    <h2>Editar Libro</h2>
    
    <a href="/dashboard">Inicio</a> | 
    <a href="/cerrar_sesion">Cerrar Sesión</a>

    <hr>

    {% with mensajes = get_flashed_messages(category_filter=['crear_libro']) %}
        {% for mensaje in mensajes %}
            <p class="error">{{ mensaje }}</p>
        {% endfor %}
    {% endwith %}

    <form action="/actualizar_libro/{{ libro.id }}" method="post">
        <br>
        <label for="titulo">Título:</label>
        <input type="text" id="titulo" name="titulo" value="{{ libro.titulo }}">
        
        <br><br>
        <label for="autor">Autor:</label>
        <input type="text" id="autor" name="autor" value="{{ libro.autor }}">
        
        <br><br>
        <label for="sinopsis">Sinopsis:</label>
        <textarea id="sinopsis" name="sinopsis">{{ libro.sinopsis }}</textarea>
        
    
        <br><br>
        <input type="submit" value="Guardar">
    </form>
</body>
</html>
